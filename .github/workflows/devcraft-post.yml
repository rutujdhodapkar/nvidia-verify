name: DEV/CRAFT LinkedIn Post

on:
  schedule:
    # 3 LinkedIn posts/day at the best India (IST) times per 2026 India data:
    #   03:00 UTC = 08:30 IST (morning peak), 06:30 UTC = 12:00 IST (lunch),
    #   14:00 UTC = 19:30 IST (evening wind-down peak)
    - cron: '0 3 * * *'
    - cron: '30 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-devcraft-post]

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate and post
        run: node scripts/composio-agent.js
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_PAGE_ID: ${{ secrets.LINKEDIN_PAGE_ID }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          ZAPIER_TOKEN: ${{ secrets.ZAPIER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_AT_PEAK: '0'
