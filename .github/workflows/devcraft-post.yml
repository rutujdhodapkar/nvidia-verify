name: DEV/CRAFT LinkedIn Post

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-devcraft-post]

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Debug Zapier tools
        run: |
          node --input-type=module -e '
            const token = process.env.ZAPIER_TOKEN;
            const res = await fetch("https://mcp.zapier.com/api/v1/connect?token=" + encodeURIComponent(token), {
              method: "POST",
              headers: { "Accept": "application/json, text/event-stream", "Content-Type": "application/json" },
              body: JSON.stringify({ jsonrpc: "2.0", method: "tools/list", id: 1, params: {} }),
            });
            const txt = await res.text();
            const names = [...txt.matchAll(/"name":"([^"]+)"/g)].map(m => m[1]);
            console.log("TOOLS:", JSON.stringify([...new Set(names)].slice(0, 50)));
          '
        env:
          ZAPIER_TOKEN: ${{ secrets.ZAPIER_TOKEN }}

      - name: Generate and post
        run: node scripts/composio-agent.js
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_PAGE_ID: ${{ secrets.LINKEDIN_PAGE_ID }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          ZAPIER_TOKEN: ${{ secrets.ZAPIER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
