name: DEV/CRAFT LinkedIn Engage

on:
  schedule:
    # Runs shortly after posting and again a few hours later to keep the post hot
    # by replying to every new comment (comment depth = #1 ranking signal).
    - cron: '30 11 * * *'   # 17:00 IST
    - cron: '30 14 * * *'   # 20:00 IST
  workflow_dispatch:

jobs:
  reply-to-comments:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Reply to new comments
        run: node scripts/engage.js
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_PAGE_ID: ${{ secrets.LINKEDIN_PAGE_ID }}
