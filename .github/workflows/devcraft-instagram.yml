name: DEV/CRAFT Instagram Posts (1x Daily IST)

on:
  schedule:
    - cron: '0 8 * * *'    # 13:30 IST — optimal midday peak
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate Swiss-style card and post to Instagram
        run: node scripts/instagram-agent.js
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          INSTAGRAM_CONNECTION_ID: ${{ secrets.INSTAGRAM_CONNECTION_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}