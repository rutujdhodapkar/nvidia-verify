name: DEV/CRAFT LinkedIn Posts (3x Daily IST)

on:
  schedule:
    # Run every 30 minutes during IST daytime (04:00-16:00 UTC = 09:30-21:30 IST)
    - cron: '0,30 4-16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (blank = auto by time)'
        required: false
        type: choice
        options:
          - ''
          - morning
          - midday
          - afternoon
          - evening-early
          - evening-late
          - evening

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright chromium (site scraping)
        run: npx playwright install chromium --with-deps

      - name: Generate and post to LinkedIn
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          LINKEDIN_CONNECTION_ID: ${{ secrets.LINKEDIN_CONNECTION_ID || 'ca_aALairrVKGhQ' }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          ZAPIER_TOKEN: ${{ secrets.ZAPIER_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_PAGE_ID: ${{ secrets.LINKEDIN_PAGE_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          SITE_URL: https://devcraft.fennark.xyz
        run: node scripts/linkedin-automation.js ${{ github.event.inputs.slot }}